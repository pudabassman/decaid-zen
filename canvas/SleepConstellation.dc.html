  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;0,6..72,400;1,6..72,300&family=Jost:wght@300;400;500&family=Spectral:wght@200;300&display=swap">
  <style>
    body { margin: 0; background: #0b0a09; font-family: "Jost", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #4fbcc6; } a:hover { color: #7fd6de; }
    .display { font-family: "Newsreader", Georgia, serif; font-weight: 300; font-variant-numeric: lining-nums proportional-nums; }
    .n { font-family: "Spectral", Georgia, serif; font-weight: 200; letter-spacing: -0.005em; font-variant-numeric: lining-nums proportional-nums; }
    .cap { font-size: 10px; letter-spacing: 0.34em; text-transform: uppercase; color: rgba(236,231,219,0.16); }
    .breathe { animation: breathe 6s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.20; } 50% { opacity: 0.62; } }
    .drift { animation: drift 24s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
    @media (prefers-reduced-motion: reduce) {
      .breathe, .drift { animation: none; }
    }
  </style>
</helmet>
