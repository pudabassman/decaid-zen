<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;0,6..72,400;1,6..72,300&family=Jost:wght@300;400;500&family=Spectral:wght@200;300&display=swap">
  <style>
    body { margin: 0; background: #131210; font-family: "Jost", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #4fbcc6; } a:hover { color: #7fd6de; }
    .display { font-family: "Newsreader", Georgia, serif; font-weight: 300; font-variant-numeric: lining-nums proportional-nums; }
    .n { font-family: "Spectral", Georgia, serif; font-weight: 200; letter-spacing: -0.005em; font-variant-numeric: lining-nums proportional-nums; }
    .cap { font-size: 10px; letter-spacing: 0.34em; text-transform: uppercase; color: #7d7669; }
    .handle { position: absolute; width: 48px; height: 96px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .act { position: relative; }
    .trace { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
    .trace rect, .trace circle { stroke-dasharray: 100; stroke-dashoffset: 100; }
    .act:focus .trace rect, .act:focus .trace circle { animation: traceRun 700ms cubic-bezier(0.4,0,0.2,1) forwards, traceFade 400ms 720ms ease-out forwards; }
    @keyframes traceRun { to { stroke-dashoffset: 0; } }
    @keyframes traceFade { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .act:focus .trace rect, .act:focus .trace circle { animation: none; } }
    .btn { background: rgba(236,231,219,0.05); border: 1px solid rgba(236,231,219,0.26); color: rgba(236,231,219,0.62);
           transition: background-color 320ms ease, border-color 320ms ease, color 320ms ease; }
    .btn:focus { background: rgba(236,231,219,0.13); border-color: #ece7db; color: #ece7db; outline: none; }
    .btn.quiet { border-color: rgba(236,231,219,0.14); color: rgba(236,231,219,0.42); }
    .btn.quiet:focus { border-color: rgba(236,231,219,0.7); color: rgba(236,231,219,0.85); }
    .btn .trace rect, .btn .trace circle { stroke: #ece7db; }
    .grip { width: 4px; height: 64px; border-radius: 999px; background: #45413a; }
    .swatch { display: flex; align-items: baseline; gap: 9px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; }
  </style>
</helmet>
<div style="width: 1280px; height: 800px; overflow: hidden; background: #131210; color: #ece7db; position: relative;">

  <div style="position: absolute; left: 60px; top: 16px; display: flex; align-items: center; gap: 16px;">
    <span style="width: 6px; height: 6px; border-radius: 50%; background: #4fbcc6;"></span>
    <span class="cap" style="color: #ece7db;">Ready</span>
  </div>

  <div style="position: absolute; right: 60px; top: 12px; display: flex; align-items: baseline; gap: 34px;">
    <div style="text-align: right;"><div class="cap" style="margin-bottom: 6px;">Group</div><span class="n display" style="font-size: 26px;">93.0&deg;</span></div>
    <div style="text-align: right;"><div class="cap" style="margin-bottom: 6px;">Steam</div><span class="n display" style="font-size: 26px;">135.5&deg;</span></div>
    <div style="text-align: right;"><div class="cap" style="margin-bottom: 6px;">Scale</div><span class="n display" style="font-size: 26px;">0.0 g</span></div>
  </div>

  <div style="position: absolute; left: 60px; top: 84px; right: 60px; display: flex; align-items: flex-end; justify-content: space-between;">
    <div>
      <div class="cap" style="margin-bottom: 18px;">Square Mile &nbsp;&middot;&nbsp; roasted 28 January</div>
      <div class="display" style="font-size: 76px; line-height: 0.98; letter-spacing: -0.02em;">Ethiopia Yirgacheffe</div>
    </div>
    <div style="display: flex; align-items: baseline; gap: 40px;">
      <div style="text-align: right;"><div class="cap" style="margin-bottom: 8px;">Dose</div><span class="n display" style="font-size: 38px;">18.0 g</span></div>
      <div style="text-align: right;"><div class="cap" style="margin-bottom: 8px;">Yield</div><span class="n display" style="font-size: 38px;">36.0 g</span></div>
      <div style="text-align: right;"><div class="cap" style="margin-bottom: 8px;">Ratio</div><span class="n display" style="font-size: 38px; color: #d3b06a;">1:2.0</span></div>
      <div style="text-align: right;"><div class="cap" style="margin-bottom: 8px;">Grind</div><span class="n display" style="font-size: 38px;">2.5</span></div>
    </div>
  </div>

  <div style="position: absolute; left: 60px; right: 60px; top: 296px; display: flex; align-items: baseline; justify-content: space-between;">
    <span class="cap" style="color: #ece7db;">Last shot &nbsp;&middot;&nbsp; today 10:30 &nbsp;&middot;&nbsp; 1:2.01 &nbsp;&middot;&nbsp; 28.4 s</span>
    <div style="display: flex; align-items: baseline; gap: 30px;">
      <div class="swatch"><span class="dot" style="background: #d9714f;"></span><span class="n display" style="font-size: 22px; color: #d9714f;">93.2&deg;</span><span class="cap" style="color: #d9714f;">brew</span></div>
      <div class="swatch"><span class="dot" style="background: #9fb055;"></span><span class="n display" style="font-size: 22px; color: #9fb055;">9.1</span><span class="cap" style="color: #9fb055;">peak bar</span></div>
      <div class="swatch"><span class="dot" style="background: #d3b06a;"></span><span class="n display" style="font-size: 22px; color: #d3b06a;">36.2</span><span class="cap" style="color: #d3b06a;">grams</span></div>
      <div class="swatch"><span class="dot" style="background: #4fbcc6;"></span><span class="n display" style="font-size: 22px; color: #4fbcc6;">2.4</span><span class="cap" style="color: #4fbcc6;">ml/s avg</span></div>
    </div>
  </div>

  <svg viewBox="0 0 1160 240" width="1160" height="341" preserveAspectRatio="none" style="position: absolute; left: 60px; top: 338px; display: block; overflow: visible;">
    <g stroke="#201e1a" stroke-width="1">
      <line x1="0" y1="0" x2="1160" y2="0"/><line x1="0" y1="80" x2="1160" y2="80"/><line x1="0" y1="160" x2="1160" y2="160"/>
    </g>
    <line x1="0" y1="240" x2="1160" y2="240" stroke="#35322b" stroke-width="1"/>
    <g stroke="#302d27" stroke-width="1" stroke-dasharray="1 5">
      <line x1="245" y1="0" x2="245" y2="240"/><line x1="1061" y1="0" x2="1061" y2="240"/>
    </g>
    <text x="251" y="234" fill="#5d574c" font-family="Jost, sans-serif" font-size="9" letter-spacing="2.4">BLOOM</text>
    <text x="1067" y="234" fill="#5d574c" font-family="Jost, sans-serif" font-size="9" letter-spacing="2.4">RAMP</text>

    <defs>
      <filter id="glowTemp" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#d9714f" flood-opacity="0.45"/></filter>
      <filter id="glowBar" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#9fb055" flood-opacity="0.45"/></filter>
      <filter id="glowWeight" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#d3b06a" flood-opacity="0.45"/></filter>
      <filter id="glowFlow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#4fbcc6" flood-opacity="0.45"/></filter>
    </defs>
    <path d="M0,31 L145,31 C200,33 240,40 300,41 C450,43 620,37 820,34 C980,32 1080,31 1160,30" fill="none" stroke="#d9714f" stroke-width="1.6" filter="url(#glowTemp)"/>
    <path d="M0,238 C40,238 80,190 170,166 C210,158 230,157 245,158 C460,170 760,180 1000,182 C1040,183 1055,182 1061,182 C1090,140 1130,84 1160,58" fill="none" stroke="#9fb055" stroke-width="2.2" filter="url(#glowBar)"/>
    <path d="M0,239 L387,238 C450,232 540,206 640,178 C780,138 940,84 1160,23" fill="none" stroke="#d3b06a" stroke-width="2.2" filter="url(#glowWeight)"/>
    <path d="M0,238 C18,190 40,42 68,38 C104,34 150,96 200,130 C280,158 520,160 760,156 C900,153 1060,148 1160,140" fill="none" stroke="#4fbcc6" stroke-width="1.7" filter="url(#glowFlow)"/>
    <circle cx="1160" cy="30" r="3.6" fill="#d9714f"/><circle cx="1160" cy="58" r="4" fill="#9fb055"/>
    <circle cx="1160" cy="23" r="4" fill="#d3b06a"/><circle cx="1160" cy="140" r="3.6" fill="#4fbcc6"/>

    <text x="-14" y="4" fill="#5d574c" font-family="Jost, sans-serif" font-size="9" text-anchor="end" letter-spacing="1.6">12</text>
    <text x="-14" y="164" fill="#5d574c" font-family="Jost, sans-serif" font-size="9" text-anchor="end" letter-spacing="1.6">4</text>
    <text x="-14" y="242" fill="#5d574c" font-family="Jost, sans-serif" font-size="9" text-anchor="end" letter-spacing="1.6">0</text>
    <text x="408" y="260" fill="#5d574c" font-family="Jost, sans-serif" font-size="9" text-anchor="middle" letter-spacing="1.6">10s</text>
    <text x="816" y="260" fill="#5d574c" font-family="Jost, sans-serif" font-size="9" text-anchor="middle" letter-spacing="1.6">20s</text>
    <text x="1160" y="260" fill="#5d574c" font-family="Jost, sans-serif" font-size="9" text-anchor="end" letter-spacing="1.6">28.4s</text>
  </svg>

  <div style="position: absolute; left: 60px; right: 60px; top: 720px; height: 1px; background: #302d27;"></div>

  <div style="position: absolute; left: 60px; bottom: 14px; display: flex; align-items: center; gap: 14px;">
    <button class="act btn" style="width: 60px; height: 60px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;">
      <svg class="trace" viewBox="0 0 60 60" width="60" height="60"><circle cx="30.0" cy="30.0" r="29.0" pathLength="100" fill="none" stroke="#4fbcc6" stroke-width="1.5" stroke-linecap="round"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7d7669" stroke-width="1.3" stroke-linecap="round"><path d="M8 20V9"/><path d="M12 4c1.5 2-1.5 3.5 0 5.5"/><path d="M16 5c1.5 2-1.5 3.5 0 5.5"/><path d="M5 20h6"/></svg>
    </button>
    <button class="act btn" style="width: 60px; height: 60px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;">
      <svg class="trace" viewBox="0 0 60 60" width="60" height="60"><circle cx="30.0" cy="30.0" r="29.0" pathLength="100" fill="none" stroke="#4fbcc6" stroke-width="1.5" stroke-linecap="round"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7d7669" stroke-width="1.3" stroke-linecap="round"><path d="M12 3c3.5 5 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 2.5-6 6-11z"/></svg>
    </button>
    <button class="act btn" style="width: 60px; height: 60px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;">
      <svg class="trace" viewBox="0 0 60 60" width="60" height="60"><circle cx="30.0" cy="30.0" r="29.0" pathLength="100" fill="none" stroke="#4fbcc6" stroke-width="1.5" stroke-linecap="round"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7d7669" stroke-width="1.3" stroke-linecap="round"><path d="M4 6h16"/><path d="M7 6v10a3 3 0 0 0 3 3h4a3 3 0 0 0 3-3V6"/><path d="M11 10v5M14 10v5"/></svg>
    </button>
    <span class="cap" style="margin-left: 18px;">Blooming Espresso &nbsp;&middot;&nbsp; tank 1.4 L</span>
  </div>

  <div style="position: absolute; right: 60px; bottom: 12px; display: flex; align-items: center; gap: 16px;">
    <button class="act btn" style="width: 196px; height: 56px; border-radius: 999px; cursor: pointer; font-family: inherit;">
      <svg class="trace" viewBox="0 0 196 56" width="196" height="56"><rect x="0.75" y="0.75" width="194.5" height="54.5" rx="27.25" pathLength="100" fill="none" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="display" style="font-size: 24px; letter-spacing: 0.03em;">Sleep</span>
    </button>
  </div>

  <button class="handle" style="left: 0; top: 352px;" title="Swipe right: workflow and beans">
    <span class="grip"></span>
  </button>
  <button class="handle" style="right: 0; top: 352px;" title="Swipe left: machine detail">
    <span class="grip"></span>
  </button>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
